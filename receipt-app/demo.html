<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payment receipt</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:#fff;color:#111827;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
</style>
</head>
<body>
<div id="app" class="mx-auto w-full max-w-[430px]"></div>
<script>
const KEY = "receipts-demo-v1";
const NOTE = "The recipient can send or spend the full amount on this date. If the recipient wishes to withdraw money, limits may apply..";
const seed = {id:"demo",recipientName:"Shyanne Kimpton",recipientHandle:"ShyanneKimpton",amount:1200.56,feeAmount:30,totalDisplayAmount:1200.56,secondaryDisplayAmount:1200.56,currency:"USD",status:"pending",estimatedDelivery:"2026-11-18T00:00:00.000Z",noteText:NOTE,createdAt:new Date().toISOString()};
let db = null, cur = "demo";
try { db = JSON.parse(localStorage.getItem(KEY) || "null"); cur = localStorage.getItem(KEY+"-cur") || "demo"; } catch (e) {}
if (!Array.isArray(db) || !db.length) db = [seed];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); localStorage.setItem(KEY+"-cur", cur); } catch (e) {} };
const $ = (s) => document.querySelector(s);
const app = $("#app");
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (n) => new Intl.NumberFormat("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const money = (n,c) => num(n)+" "+c;
const sym = (n,c) => new Intl.NumberFormat("en-US",{style:"currency",currency:c,currencyDisplay:"narrowSymbol"}).format(n)+" "+c;
const dt = (iso) => new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}).format(new Date(iso));
const find = (id) => db.find(r => r.id === id);
const go = (h) => { location.hash = h; };

const shell = (inner) => `<main class="flex min-h-screen flex-col bg-white px-6 pb-8 pt-20">${inner}</main>`;
const row = (label, sub, val, subVal, extra="") => `
  <div class="flex items-start justify-between gap-4 py-4">
    <div><div class="flex items-center gap-1.5 font-medium text-[#111827]">${label}${extra}</div>${sub?`<div class="mt-0.5 text-sm text-[#6B7280]">${sub}</div>`:""}</div>
    <div class="text-right"><div class="font-medium text-[#111827]">${val}</div>${subVal?`<div class="mt-0.5 text-sm text-[#6B7280]">${subVal}</div>`:""}</div>
  </div>`;

function receiptView() {
  app.innerHTML = shell(`<div class="animate-pulse flex-1"><div class="mx-auto h-6 w-4/5 rounded bg-gray-200"></div><div class="mx-auto mt-3 h-6 w-3/5 rounded bg-gray-200"></div><div class="mx-auto mt-6 h-3 w-full rounded bg-gray-100"></div><div class="mx-auto mt-2 h-3 w-5/6 rounded bg-gray-100"></div><div class="mt-12 space-y-8">${"<div class='flex justify-between'><div class='h-4 w-24 rounded bg-gray-200'></div><div class='h-4 w-28 rounded bg-gray-200'></div></div>".repeat(4)}</div></div>`);
  const token = ++renderToken;
  setTimeout(() => { if (token === renderToken) drawReceipt(); }, 350);
}

function drawReceipt() {
  const r = find(cur) || db[0];
  cur = r.id; save();
  const info = `<span class="relative inline-flex"><button id="fee-i" type="button" aria-label="Fee details" aria-expanded="false" class="flex h-4 w-4 items-center justify-center rounded-full border border-[#6B7280] text-[10px] font-semibold leading-none text-[#6B7280]">i</button><span id="fee-tip" role="tooltip" class="absolute left-0 top-6 z-10 hidden w-56 rounded-xl bg-[#111827] p-3 text-xs font-normal leading-snug text-white shadow-lg">This fee covers processing of your transfer and will be refunded to the recipient.</span></span>`;
  app.innerHTML = shell(`
    <div class="flex-1">
      <h1 class="text-center text-2xl font-bold leading-tight text-[#111827]">Your ${esc(sym(r.amount,r.currency))} payment to ${esc(r.recipientName)} is ${esc(r.status)}</h1>
      <p class="mt-4 text-center text-sm leading-relaxed text-[#6B7280]">We’ve sent the money to @${esc(r.recipientHandle)}.. Please note that this fee will be refunded to the recipient. You can see the details in your activity if you need them later.</p>
      <section class="mt-10">
        ${row("Amount","",esc(money(r.amount,r.currency)))}
        ${row("Fee","",esc(money(r.feeAmount,r.currency)),"",info)}
        ${row("You pay","@"+esc(r.recipientHandle),esc(money(r.totalDisplayAmount,r.currency)),esc(money(r.secondaryDisplayAmount,r.currency)))}
        ${row("Estimated delivery","",esc(dt(r.estimatedDelivery)))}
      </section>
      <p class="mt-6 text-xs leading-relaxed text-[#6B7280]">Note : ${esc(r.noteText)}</p>
    </div>
    <div class="mt-10">
      <button id="done" class="w-full rounded-full bg-black py-4 text-base font-bold text-white active:opacity-80">Done</button>
      <button id="more" class="mt-4 block w-full text-center text-sm font-medium text-[#2563EB]">Send More</button>
    </div>`);
  const tip = $("#fee-tip"), btn = $("#fee-i");
  const toggle = (show) => { tip.classList.toggle("hidden", !show); btn.setAttribute("aria-expanded", show); };
  btn.onclick = () => toggle(tip.classList.contains("hidden"));
  btn.onmouseenter = () => toggle(true); btn.onmouseleave = () => toggle(false);
  $("#done").onclick = () => go("activity");
  $("#more").onclick = () => go("send");
}

function activityView() {
  const items = [...db].sort((a,b) => b.createdAt.localeCompare(a.createdAt));
  app.innerHTML = `<main class="min-h-screen bg-white px-6 pt-16"><h1 class="text-2xl font-bold">Activity</h1>
    <ul class="mt-6 divide-y divide-gray-100">${items.map(r => `<li><button data-id="${esc(r.id)}" class="flex w-full justify-between py-4 text-left"><div><div class="font-medium">${esc(r.recipientName)}</div><div class="text-sm capitalize text-[#6B7280]">${esc(r.status)} · ${esc(dt(r.createdAt))}</div></div><div class="font-medium">${esc(money(r.amount,r.currency))}</div></button></li>`).join("")}</ul></main>`;
  app.querySelectorAll("[data-id]").forEach(b => b.onclick = () => { cur = b.dataset.id; save(); go("receipt"); });
}

function sendView() {
  const r = find(cur) || db[0];
  const inp = "w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-[#111827] outline-none focus:border-[#111827]";
  const f = (label, name, val, extra="") => `<label class="block"><span class="mb-1 block text-xs font-medium text-[#6B7280]">${label}</span><input name="${name}" value="${esc(val)}" class="${inp}" ${extra}></label>`;
  app.innerHTML = `<main class="min-h-screen bg-white px-6 pb-10 pt-16"><h1 class="text-2xl font-bold">Send more</h1>
    <p class="mt-1 text-sm text-[#6B7280]">Edit any detail, then send. This creates a new receipt.</p>
    <form id="form" class="mt-8 space-y-4" novalidate>
      ${f("Recipient name","recipientName",r.recipientName)}
      ${f("Recipient handle (no @)","recipientHandle",r.recipientHandle)}
      <div class="grid grid-cols-3 gap-3"><div class="col-span-2">${f("Amount","amount",r.amount,'inputmode="decimal"')}</div>${f("Currency","currency",r.currency,'maxlength="3"')}</div>
      ${f("Fee","feeAmount",r.feeAmount,'inputmode="decimal"')}
      <div class="grid grid-cols-2 gap-3">${f("You pay (total)","totalDisplayAmount",r.totalDisplayAmount,'inputmode="decimal"')}${f("You pay (sub-amount)","secondaryDisplayAmount",r.secondaryDisplayAmount,'inputmode="decimal"')}</div>
      <div class="grid grid-cols-2 gap-3">
        <label class="block"><span class="mb-1 block text-xs font-medium text-[#6B7280]">Status</span><select name="status" class="${inp}">${["pending","completed","failed"].map(s=>`<option value="${s}" ${s===r.status?"selected":""}>${s[0].toUpperCase()+s.slice(1)}</option>`).join("")}</select></label>
        <label class="block"><span class="mb-1 block text-xs font-medium text-[#6B7280]">Estimated delivery</span><input type="date" name="estimatedDelivery" value="${esc(r.estimatedDelivery.slice(0,10))}" class="${inp}"></label>
      </div>
      <label class="block"><span class="mb-1 block text-xs font-medium text-[#6B7280]">Note</span><textarea name="noteText" rows="3" maxlength="500" class="${inp}">${esc(r.noteText)}</textarea></label>
      <p id="err" class="hidden text-sm text-red-600"></p>
      <button class="w-full rounded-full bg-black py-4 font-bold text-white">Send</button>
      <button type="button" id="cancel" class="block w-full text-center text-sm font-medium text-[#2563EB]">Cancel</button>
    </form></main>`;
  $("#cancel").onclick = () => go("receipt");
  $("#form").onsubmit = (e) => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(e.target));
    const amount = parseFloat(v.amount), fee = parseFloat(v.feeAmount || "0");
    const bad = !v.recipientName.trim() ? "Recipient name is required."
      : !/^@?[A-Za-z0-9_.]+$/.test(v.recipientHandle.trim()) ? "Handle: letters, numbers, _ and . only."
      : !(amount > 0) ? "Amount must be greater than 0."
      : !(fee >= 0) ? "Fee can’t be negative."
      : !/^[A-Za-z]{3}$/.test(v.currency.trim()) ? "Currency must be a 3-letter code." : "";
    if (bad) { const el = $("#err"); el.textContent = bad; el.classList.remove("hidden"); return; }
    const r2 = (n) => Math.round(n * 100) / 100;
    const total = v.totalDisplayAmount !== "" ? r2(parseFloat(v.totalDisplayAmount)) : r2(amount);
    const sec = v.secondaryDisplayAmount !== "" ? r2(parseFloat(v.secondaryDisplayAmount)) : total;
    const when = v.estimatedDelivery ? v.estimatedDelivery + "T00:00:00.000Z" : new Date(Date.now() + 3*864e5).toISOString();
    const rec = {id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), recipientName: v.recipientName.trim(), recipientHandle: v.recipientHandle.trim().replace(/^@/,""), amount: r2(amount), feeAmount: r2(fee), totalDisplayAmount: total, secondaryDisplayAmount: sec, currency: v.currency.trim().toUpperCase(), status: v.status, estimatedDelivery: when, noteText: v.noteText || NOTE, createdAt: new Date().toISOString()};
    db.unshift(rec); cur = rec.id; save(); go("receipt");
  };
}

let renderToken = 0;
function route() {
  renderToken++;
  window.scrollTo(0, 0);
  const h = location.hash.slice(1);
  if (h === "activity") activityView(); else if (h === "send") sendView(); else receiptView();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
